{{- if not .Values.auth.existingSecret }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace (include "argus.secretName" .) }}
{{- $data := dict }}
{{- if $existing }}{{ $data = $existing.data }}{{ end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "argus.secretName" . }}
  labels:
    {{- include "argus.labels" . | nindent 4 }}
type: Opaque
data:
  ADMIN_EMAIL: {{ .Values.auth.adminEmail | b64enc | quote }}
  ADMIN_PASSWORD: {{ .Values.auth.adminPassword | b64enc | default (get $data "ADMIN_PASSWORD") | default (randAlphaNum 20 | b64enc) | quote }}
  AGENT_TOKEN: {{ .Values.auth.agentToken | b64enc | default (get $data "AGENT_TOKEN") | default (randAlphaNum 32 | b64enc) | quote }}
{{- end }}
